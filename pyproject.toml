[project]
name = "assemblyzero-tools"
version = "0.1.0"
description = "AssemblyZero configuration and tooling"
authors = [{name = "Marty McEnroe"}]
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "keyring (>=25.7.0,<26.0.0)",
    "anthropic (>=0.125.0,<1.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "langgraph-checkpoint-sqlite (>=3.1.1,<4.0.0)",
    "langchain (>=1.4.0,<2.0.0)",
    "langchain-google-genai (>=4.3.6,<5.0.0)",
    "langchain-anthropic (>=1.7.0,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "google-genai (>=1.75.0,<2.0.0)",
    "pygithub (>=2.10.0,<3.0.0)",
    "tiktoken (>=0.14.0,<1.0.0)",
    "langchain-core (>=1.6.3,<2.0.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "packaging (>=26.3,<27.0)",
    "pathspec (>=1.1.1,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "jiter (>=0.13.0,<0.14.0)",
    "orjson (>=3.12.0,<4.0.0)",
    "langsmith (>=0.8.18,<0.9.0)",
    "google-auth (>=2.57.1,<3.0.0)",
    "pycparser (>=3.0,<4.0)",
    "boto3 (>=1.43.93,<2.0.0)",
    "pywinpty (>=3.0.3,<4.0.0) ; sys_platform == \"win32\"",
    "psutil (>=7.0.0,<8.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    # #2185: numpy arrives transitively through matplotlib, whose own
    # constraint (>=1.23) is wide open, so the resolver was bounded by THIS
    # project's floor instead. Named explicitly to keep the floor that broke
    # installs from silently reappearing through a transitive path.
    "numpy (>=2.5.3,<3.0.0)",
    "pillow (>=12.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e and not adversarial'"
markers = [
    "integration: tests that call real external services (deselect with '-m \"not integration\"')",
    "e2e: end-to-end workflow tests requiring sandbox repo",
    "expensive: tests that use significant API quota",
    "adversarial: adversarial tests generated by Gemini Pro (deselect with '-m \"not adversarial\"')",
    "windows_paths: exercises Windows-only code the fleet actually runs (#2431). CI's ubuntu job never reaches these, so a windows-latest job selects them with '-m windows_paths'.",
]

[tool.ruff]
# The lint target is the code under maintenance. `docs/lineage/` is the
# design-review trail: generated `NNN-test-scaffold.py` and friends, recording
# what a workflow produced on a given run. Nothing imports them and nothing runs
# them, and editing them to satisfy a linter would rewrite the record -- which is
# the opposite of what a lineage trail is for (#3472).
#
# All 14 of the repo's invalid-syntax findings are in there. That is evidence
# about a generator's output, worth keeping and arguably worth investigating; it
# is not a lint defect in this repo's source.
#
# `tests/fixtures/issue7_run*/` is captured generator output -- what the
# scaffolding workflow emitted on the run named by the directory. Nothing
# imports it; five test modules read it BY PATH as text and assert on its
# contents (#3479). Editing an import line there edits the input a test
# measures, so a "fix" would either silently change what is being tested or
# fail and invite someone to edit the fixture further.
#
# Only the recorded-run directories. `tests/fixtures/` as a whole stays linted:
# it also holds real importable helpers, `tests/fixtures/scraper` among them.
#
# This narrows WHAT IS LINTED, never what counts as an error. No rule is
# disabled and no severity lowered -- see #3471 for the rule-by-rule work.
extend-exclude = ["docs/lineage", "tests/fixtures/issue7_run*"]

[tool.ruff.lint.per-file-ignores]
# E402 here is structural, not stylistic (#3484). Each of these is a standalone
# script that puts the repo root on `sys.path` before importing `assemblyzero`:
#
#     sys.path.insert(0, str(Path(__file__).parent.parent))
#     from assemblyzero.tracing import configure_langsmith
#
# The import cannot precede the insert -- that is how a script in `tools/`
# reaches the package without the package being installed. Moving it up breaks
# the script.
#
# Verified per file rather than assumed: every entry below contains exactly one
# `sys.path.insert` above its first flagged import. The files where the late
# import was INCIDENTAL -- a logger or a constant that had drifted into the
# import block -- were fixed by moving the statement instead, and are
# deliberately absent from this list.
"tools/collect-cross-project-metrics.py" = ["E402"]
"tools/orchestrate.py" = ["E402"]
"tools/run_implement_from_lld.py" = ["E402"]
"tools/run_implementation_spec_workflow.py" = ["E402"]
"tools/run_requirements_workflow.py" = ["E402"]
"tools/run_scout_workflow.py" = ["E402"]
"tools/test-gate.py" = ["E402"]
"tests/tools/test_claude_usage_scraper.py" = ["E402"]

[tool.poetry]
packages = [{include = "assemblyzero"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.coverage.run]
source = ["assemblyzero"]

[tool.coverage.report]
show_missing = true